name: Keep backend warm

# Pings the deep health endpoint every 5 minutes so that the Vercel function and the Neon compute
# (which suspends after a few idle minutes) do not cold start in front of real users.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health/db
        run: |
          curl --fail --silent --show-error --max-time 25 --retry 2 --retry-delay 3 \
            "https://apex-backend-ten.vercel.app/api/health/db"
